<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- NFSMount icon: NAS server + shared folder + network tee -->
  <!-- server box (behind, top-left), slight 2.5D -->
  <g>
    <!-- top face -->
    <polygon points="6,17 40,17 48,10 14,10" fill="#b8c4d6"/>
    <!-- right face -->
    <polygon points="40,17 48,10 48,36 40,43" fill="#8e9cb4"/>
    <!-- front face -->
    <rect x="6" y="17" width="34" height="26" rx="2" fill="#cfd8e6"/>
    <rect x="6" y="17" width="34" height="26" rx="2" fill="none" stroke="#5a6880" stroke-width="1.5"/>
    <!-- vent slits -->
    <rect x="10" y="36" width="12" height="1.8" rx="0.9" fill="#8e9cb4"/>
    <rect x="10" y="32.5" width="12" height="1.8" rx="0.9" fill="#8e9cb4"/>
    <!-- LEDs -->
    <circle cx="12" cy="22.5" r="2" fill="#3fc73f" stroke="#1f7a1f" stroke-width="0.8"/>
    <circle cx="12" cy="28" r="2" fill="#ffb820" stroke="#a06900" stroke-width="0.8"/>
  </g>
  <!-- network tee (bottom-left) -->
  <g stroke="#5a6880" stroke-width="1.2">
    <rect x="20" y="43" width="5" height="6" fill="#aab6c8"/>
    <rect x="4" y="49" width="38" height="5" rx="2.5" fill="#aab6c8"/>
    <rect x="2" y="47.5" width="6" height="8" rx="2" fill="#4a78c0"/>
    <rect x="38" y="47.5" width="6" height="8" rx="2" fill="#4a78c0"/>
  </g>
  <!-- paper sticking out -->
  <polygon points="30,22 52,22 56,30 34,30" fill="#f2f4f8" stroke="#9aa6ba" stroke-width="1"/>
  <!-- folder (front) -->
  <g>
    <path d="M 26 24 L 38 24 L 41 28 L 60 28 Q 62 28 62 30 L 62 56 Q 62 58 60 58 L 28 58 Q 26 58 26 56 Z"
      fill="#f5b821" stroke="#a06900" stroke-width="1.6"/>
    <!-- folder shading: darker bottom lip -->
    <path d="M 26 52 L 62 52 L 62 56 Q 62 58 60 58 L 28 58 Q 26 58 26 56 Z" fill="#dd9e0e"/>
    <!-- people glyph (3 heads + bodies), brown like the source -->
    <g fill="#8a5d00">
      <circle cx="38" cy="38" r="3"/>
      <path d="M 33 48 Q 33 42 38 42 Q 43 42 43 48 Z"/>
      <circle cx="50" cy="38" r="3"/>
      <path d="M 45 48 Q 45 42 50 42 Q 55 42 55 48 Z"/>
      <circle cx="44" cy="35.5" r="3.4"/>
      <path d="M 38.5 47 Q 38.5 40 44 40 Q 49.5 40 49.5 47 Z"/>
    </g>
  </g>
</svg>
